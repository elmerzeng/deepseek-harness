{{- if and (not .Values.deepseek.existingSecret) (or .Values.web.enabled .Values.sdk.enabled) }}
{{- if not .Values.deepseek.apiKey }}{{ fail "set deepseek.apiKey or deepseek.existingSecret" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsh.secretName" . }}
  labels: {{- include "dsh.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEEPSEEK_API_KEY: {{ .Values.deepseek.apiKey | quote }}
  ATK_PROVIDER_API_KEY: {{ .Values.atk.apiKey | quote }}
  GPUSTACK_PROVIDER_API_KEY: {{ .Values.gpustack.apiKey | quote }}
  YUANBAO_API_KEY: {{ .Values.yuanbao.apiKey | quote }}
{{- end }}
