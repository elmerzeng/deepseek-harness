{{- if and .Values.pvc.create (or .Values.web.enabled .Values.sdk.enabled) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dsh.pvcName" . }}
  labels: {{- include "dsh.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.pvc.accessMode }}]
  {{- with .Values.pvc.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.pvc.size }}
{{- end }}
