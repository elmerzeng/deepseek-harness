{{- if and .Values.web.enabled .Values.web.ingress.enabled }}
{{- if not .Values.web.ingress.host }}{{ fail "web.ingress.host is required when web.ingress.enabled" }}{{ end }}
{{- $name := printf "%s-web" (include "dsh.fullname" .) }}
{{- $prefix := .Values.web.ingress.pathPrefix }}
{{- if $prefix }}
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: {{ $name }}-strip
  labels: {{- include "dsh.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ $prefix | quote }}
---
{{- end }}
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "dsh.labels" . | nindent 4 }}
    {{- with .Values.web.ingress.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.web.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints: {{ toYaml .Values.web.ingress.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.web.ingress.host }}`){{ if $prefix }} && PathPrefix(`{{ $prefix }}`){{ end }}
      {{- if $prefix }}
      middlewares:
        - name: {{ $name }}-strip
      {{- end }}
      services:
        - name: {{ $name }}
          port: {{ .Values.web.service.port }}
  {{- if .Values.web.ingress.tls }}
  tls:
    {{- with .Values.web.ingress.tlsSecretName }}
    secretName: {{ . }}
    {{- end }}
    {{- with .Values.web.ingress.certResolver }}
    certResolver: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
